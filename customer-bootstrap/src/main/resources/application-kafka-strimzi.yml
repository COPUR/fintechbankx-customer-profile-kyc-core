# In-cluster Strimzi TLS listener with the KafkaUser client certificate, bound
# from the Secret named by the chart value kafkaTls.secretName (PEM, keys
# user.crt, user.key, ca.crt by default) as KAFKA_TLS_CERT, KAFKA_TLS_KEY, KAFKA_TLS_CA.
spring:
  kafka:
    security:
      protocol: SSL
    ssl:
      key-store-type: PEM
      trust-store-type: PEM
      key-store-certificate-chain: ${KAFKA_TLS_CERT}
      key-store-key: ${KAFKA_TLS_KEY}
      trust-store-certificates: ${KAFKA_TLS_CA}
