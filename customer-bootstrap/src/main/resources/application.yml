# svc-cus-profile-kyc runtime configuration.
# Every environment-specific value comes from the environment (Helm values,
# Kubernetes Secret synced from AWS Secrets Manager); nothing secret is here.
spring:
  application:
    name: customer-profile-kyc-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_cus_profile_kyc_local}
    username: ${DB_USERNAME:customer_profile_app}
    # The credential is bound from SPRING_DATASOURCE_PASSWORD (Kubernetes Secret
    # synced from AWS Secrets Manager); it is never written in this file.
    hikari:
      schema: sc_cus_profile_kyc
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sc_cus_profile_kyc
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    schemas: sc_cus_profile_kyc
    default-schema: sc_cus_profile_kyc
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    # Runtime-neutral: authentication comes from the kafka-msk or kafka-strimzi
    # profile (SPRING_PROFILES_ACTIVE), per the platform Kafka client guide.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: svc-cus-profile-kyc
    security:
      # PLAINTEXT only for a developer machine. In a cluster (DB_SSL_ROOT_CERT set)
      # with the relay on, KafkaTlsGuard refuses to start unless the effective
      # producer protocol is SASL_SSL (kafka-msk) or SSL (kafka-strimzi).
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    admin:
      # Topics exist only through the catalog (event-streaming repo); never created from here.
      auto-create: false
    producer:
      acks: all
      compression-type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Kafka requires delivery.timeout.ms >= linger.ms + request.timeout.ms,
        # otherwise the producer cannot be constructed.
        delivery.timeout.ms: 30000
        request.timeout.ms: 20000
        linger.ms: 5
        # How long send() may block on metadata (missing topic, unreachable
        # cluster). Kafka's 60 s default would hold the relay's transaction,
        # DB connection and advisory lock for over a minute per tick.
        max.block.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/fintechbankx}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/fintechbankx/protocol/openid-connect/certs}

fintechbankx:
  security:
    # Tokens must carry the service id in "aud" (Keycloak audience mapper on each calling client).
    audience: ${OIDC_AUDIENCE:svc-cus-profile-kyc}
    # Client ids (token "azp") allowed to read and move credit with the SERVICE role.
    service-callers: ${SERVICE_CALLERS:svc-ln-loan-lifecycle}
    # Client ids (token "azp") allowed to read the KYC status with the SERVICE role.
    service-callers-kyc: ${SERVICE_CALLERS_KYC:svc-pay-initiation-settlement}
  identity:
    # Onboarding sets the Keycloak user attribute customer_id through the admin
    # API (PUT /api/v1/customers/{id}/identity-link). Off by default: linking
    # then fails closed with 503 and records nothing.
    admin:
      enabled: ${IDENTITY_ADMIN_ENABLED:false}
      base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
      realm: ${KEYCLOAK_REALM:fintechbankx}
      client-id: ${IDENTITY_ADMIN_CLIENT_ID:svc-cus-profile-kyc}
      # From the Kubernetes Secret synced from <env>/customer-profile-kyc-service/oidc-client.
      client-secret: ${IDENTITY_ADMIN_CLIENT_SECRET:}
      timeout: PT3S

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      service: svc-cus-profile-kyc
      # Platform alert rules select on app (the chart's service account) and squad.
      app: ${METRICS_APP:customer-profile-kyc-service}
      squad: ${METRICS_SQUAD:customer}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      service: svc-cus-profile-kyc

customer:
  credit:
    # A reserve, release or limit change that loses an optimistic race on the
    # customer row is run again on the fresh row up to this many times
    # (jittered pause growing by retry-backoff), then answered 409.
    max-attempts: 10
    retry-backoff: PT0.01S
  outbox:
    retention: P7D
    relay:
      # Off unless switched on (chart: runbook step 6; local runs: OUTBOX_RELAY_ENABLED=true).
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      interval: PT1S
      batch-size: 100
      # Longer than delivery.timeout.ms, so the relay never abandons a send Kafka
      # is still retrying (which would publish the event twice).
      send-timeout: PT35S
      # Only payload errors park a row; every other failure stops the batch and
      # retries after the backoff, never parking (ADR-021 decision 4; runbook
      # "Parked outbox events").
      # After a stopped batch the relay waits: the interval above, doubling per
      # stopped batch up to this cap; reset after a completed batch (ADR-021).
      backoff-max: ${OUTBOX_RELAY_BACKOFF_MAX:PT5M}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
