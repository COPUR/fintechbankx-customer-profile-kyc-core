# svc-cus-profile-kyc runtime configuration.
# Every environment-specific value comes from the environment (Helm values,
# Kubernetes Secret synced from AWS Secrets Manager); nothing secret is here.
spring:
  application:
    name: customer-profile-kyc-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_cus_profile_kyc_local}
    username: ${DB_USERNAME:customer_profile_app}
    # The credential is bound from SPRING_DATASOURCE_PASSWORD (Kubernetes Secret
    # synced from AWS Secrets Manager); it is never written in this file.
    hikari:
      schema: sc_cus_profile_kyc
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sc_cus_profile_kyc
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    schemas: sc_cus_profile_kyc
    default-schema: sc_cus_profile_kyc
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    # Runtime-neutral: authentication comes from the kafka-msk or kafka-strimzi
    # profile (SPRING_PROFILES_ACTIVE), per the platform Kafka client guide.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: svc-cus-profile-kyc
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    admin:
      # Topics exist only through the catalog (event-streaming repo); never created from here.
      auto-create: false
    producer:
      acks: all
      compression-type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        linger.ms: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/fintechbankx}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/fintechbankx/protocol/openid-connect/certs}

fintechbankx:
  security:
    # Tokens must carry the service id in "aud" (Keycloak audience mapper on each calling client).
    audience: ${OIDC_AUDIENCE:svc-cus-profile-kyc}
    # Client ids (token "azp") allowed to read and move credit with the SERVICE role.
    service-callers: ${SERVICE_CALLERS:svc-ln-loan-lifecycle}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      service: svc-cus-profile-kyc
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      service: svc-cus-profile-kyc

customer:
  outbox:
    retention: P7D
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval: PT1S
      batch-size: 100
      send-timeout: PT10S

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
