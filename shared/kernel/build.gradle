// =================================================================
// SHARED KERNEL (vendored)
// =================================================================
// Minimal subset of the monolith shared-kernel that this context uses,
// copied unchanged from enterprise-loan-management-system/shared-kernel.
// Framework dependencies are 'implementation' so they do not leak onto
// the customer-domain compile classpath.
// =================================================================

description = 'Shared Kernel - vendored subset used by the customer context'

dependencies {
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation libs.opentelemetry.api
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    compileOnly libs.lombok
    annotationProcessor libs.lombok
}
