{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "customer.secretName" . }}
  labels:
    {{- include "customer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName | quote }}
  target:
    name: {{ include "customer.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ required "externalSecret.remoteSecretName is required" .Values.externalSecret.remoteSecretName | quote }}
        property: password
    {{- with .Values.externalSecret.oidcClientSecretName }}
    - secretKey: IDENTITY_ADMIN_CLIENT_SECRET
      remoteRef:
        key: {{ . | quote }}
        property: client_secret
    {{- end }}
{{- end }}
{{- include "customer.requireMigrationSecret" . }}
---
# Schema owner credential (DB_MIGRATION_USERNAME / _PASSWORD), read only by the
# Flyway migration Job (migration-job.yaml). A hook created before the Job and
# deleted after it succeeds, so the Secret exists only while a migration runs.
# The runtime role (DB_USERNAME) gets only the grants of V13.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "customer.migrationSecretName" . }}
  labels:
    {{- include "customer.migrationLabels" . | nindent 4 }}
  annotations:
    {{- include "customer.migrationPrerequisiteHook" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName | quote }}
  target:
    name: {{ include "customer.migrationSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: DB_MIGRATION_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.migrationSecretName | quote }}
        property: username
    - secretKey: DB_MIGRATION_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.migrationSecretName | quote }}
        property: password
