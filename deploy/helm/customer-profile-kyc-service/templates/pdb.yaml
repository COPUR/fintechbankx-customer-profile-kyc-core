apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "customer.name" . }}
  labels:
    {{- include "customer.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "customer.selectorLabels" . | nindent 6 }}
