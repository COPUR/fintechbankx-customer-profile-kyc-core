{{- if .Values.externalSecret.enabled }}
# Namespaced store that reads AWS Secrets Manager as THIS service's account
# (IRSA role from deploy/terraform, output workload_role_arn). The workload
# role is therefore the only principal that can read and decrypt the
# credential; no cluster-wide store or shared ESO identity is involved.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "customer.name" . }}-aws
  labels:
    {{- include "customer.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "externalSecret.awsRegion is required" .Values.externalSecret.awsRegion | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}
{{- end }}
