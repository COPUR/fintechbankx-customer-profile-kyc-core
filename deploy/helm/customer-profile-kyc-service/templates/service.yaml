apiVersion: v1
kind: Service
metadata:
  name: {{ include "customer.name" . }}
  labels:
    {{- include "customer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "customer.podSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port | int }}
      targetPort: http
    - name: http-management
      port: {{ .Values.service.managementPort | int }}
      targetPort: http-management
