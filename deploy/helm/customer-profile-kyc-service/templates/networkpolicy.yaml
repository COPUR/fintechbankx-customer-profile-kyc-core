{{- if .Values.networkPolicy.enabled }}
# CNI-level backstop for the mesh ALLOW rules (owned by the service-mesh repo):
# only the caller namespaces reach the API port and only the observability
# namespace reaches the management port. This chart ships no
# PeerAuthentication or AuthorizationPolicy; mesh-wide STRICT mTLS applies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "customer.name" . }}
  labels:
    {{- include "customer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "customer.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.callerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
      ports:
        - port: {{ .Values.service.managementPort }}
          protocol: TCP
{{- end }}
