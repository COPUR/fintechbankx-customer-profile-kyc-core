{{- include "customer.guard" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "customer.name" . }}
  labels:
    {{- include "customer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | int }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "customer.podSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "customer.podSelectorLabels" . | nindent 8 }}
        version: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
        {{- toYaml .Values.podLabels | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- include "customer.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "customer.podSelectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "customer.podSelectorLabels" . | nindent 14 }}
      containers:
        - name: customer-profile-kyc-service
          image: {{ include "customer.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | int }}
            - name: http-management
              containerPort: {{ .Values.service.managementPort | int }}
          env:
            # Aurora server certificate trust (cicd-templates 4f0f266); DB_URL names the same file as sslrootcert.
            - name: DB_SSL_ROOT_CERT
              value: {{ include "customer.envValue" (dict "where" "databaseCa.mountPath/key" "value" (include "customer.databaseCaFile" .)) }}
            # The only Spring profile, from kafka.runtime (msk -> kafka-msk, strimzi -> kafka-strimzi); the guard
            # refuses every spring.profiles.* key in config.
            {{- $profile := include "customer.kafkaProfile" . }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ include "customer.envValue" (dict "where" "kafka.runtime" "value" $profile) }}
          {{- if eq $profile "kafka-strimzi" }}
            - name: KAFKA_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ required "kafkaTls.secretName is required for the kafka-strimzi profile" .Values.kafkaTls.secretName | quote }}
                  key: {{ .Values.kafkaTls.certKey | quote }}
            - name: KAFKA_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaTls.secretName | quote }}
                  key: {{ .Values.kafkaTls.keyKey | quote }}
            - name: KAFKA_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaTls.secretName | quote }}
                  key: {{ .Values.kafkaTls.caKey | quote }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "customer.name" . }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "customer.secretName" . }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http-management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "customer.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "customer.databaseCaMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "customer.databaseCaVolume" . | nindent 8 }}
