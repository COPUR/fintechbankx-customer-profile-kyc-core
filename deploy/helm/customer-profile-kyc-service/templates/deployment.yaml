apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "customer.name" . }}
  labels:
    {{- include "customer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "customer.podSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "customer.podSelectorLabels" . | nindent 8 }}
        version: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
        {{- toYaml .Values.podLabels | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "customer.podSelectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "customer.podSelectorLabels" . | nindent 14 }}
      containers:
        - name: customer-profile-kyc-service
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: http-management
              containerPort: {{ .Values.service.managementPort }}
          env:
            # Aurora server certificate trust (cicd-templates 4f0f266); DB_URL names the same file as sslrootcert.
            - name: DB_SSL_ROOT_CERT
              value: {{ include "customer.databaseCaFile" . | quote }}
          {{- if has "kafka-strimzi" (splitList "," (.Values.config.SPRING_PROFILES_ACTIVE | toString | nospace)) }}
            - name: KAFKA_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ required "kafkaTls.secretName is required for the kafka-strimzi profile" .Values.kafkaTls.secretName }}
                  key: {{ .Values.kafkaTls.certKey }}
            - name: KAFKA_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaTls.secretName }}
                  key: {{ .Values.kafkaTls.keyKey }}
            - name: KAFKA_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaTls.secretName }}
                  key: {{ .Values.kafkaTls.caKey }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "customer.name" . }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "customer.secretName" . }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http-management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: database-ca
              mountPath: {{ .Values.databaseCa.mountPath }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Not optional: without the platform's bundle the pod does not start, rather than connect unverified.
        - name: database-ca
          configMap:
            name: {{ required "databaseCa.configMapName is required" .Values.databaseCa.configMapName }}
            optional: false
            items:
              - key: {{ .Values.databaseCa.key }}
                path: {{ .Values.databaseCa.key }}
