# Defaults are production-shaped (multi-replica, spread across zones).
# Override per environment with values-<env>.yaml.

image:
  repository: ""   # e.g. <account>.dkr.ecr.<region>.amazonaws.com/fintechbankx/customer-profile-kyc-service
  tag: ""          # immutable tag (git SHA); never "latest"
  pullPolicy: IfNotPresent

replicaCount: 3

# Owning squad; tags every metric (squad) for the platform alert routing.
squad: customer

serviceAccount:
  name: customer-profile-kyc-service
  # IAM role from deploy/terraform output workload_role_arn (IRSA).
  roleArn: ""

# Mesh labels from the platform contract. app.kubernetes.io/name (= the chart
# name, which is the service account name) and version are set by the chart.
podLabels:
  app: customer-profile-kyc-service
  app.kubernetes.io/part-of: fintechbankx-customer
  fintechbankx.io/service-id: svc-cus-profile-kyc
  sidecar.istio.io/inject: "true"

service:
  port: 8080
  managementPort: 8081

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  # CPU only: the JVM keeps committed heap, so a memory target would pin replicas at max.
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  minAvailable: 2

# Non-secret runtime settings, rendered into a ConfigMap.
config:
  DB_URL: ""                      # jdbc:postgresql://<aurora-writer-endpoint>:5432/db_cus_profile_kyc_<env>?sslmode=require
  DB_USERNAME: customer_profile_app
  DB_POOL_MAX: "10"
  KAFKA_BOOTSTRAP_SERVERS: ""
  # kafka-msk: SASL_SSL + AWS_MSK_IAM through the service IRSA role (AWS).
  # kafka-strimzi: TLS listener of the in-cluster Strimzi cluster (local, kind).
  SPRING_PROFILES_ACTIVE: kafka-msk
  OIDC_ISSUER_URI: ""
  OIDC_JWK_SET_URI: ""
  OIDC_AUDIENCE: svc-cus-profile-kyc   # token aud must contain the service id
  SERVICE_CALLERS: svc-ln-loan-lifecycle   # token azp values allowed to read and move credit
  SERVICE_CALLERS_KYC: svc-pay-initiation-settlement   # token azp values allowed to read the KYC status
  # Off (as the application default): the relay cannot reach
  # MSK until mesh #11's egress is applied. Turn it on with
  # --set config.OUTBOX_RELAY_ENABLED=true (runbook step 6). Events wait in the
  # outbox meanwhile; nothing is lost.
  OUTBOX_RELAY_ENABLED: "false"
  # Onboarding sets the Keycloak user attribute customer_id (identity link).
  # Off until the service client holds the scoped FGAP v2 permission (users in
  # group /customers, identity 8f9024b) and externalSecret.oidcClientSecretName
  # is set; while off, linking fails closed (503).
  IDENTITY_ADMIN_ENABLED: "false"
  KEYCLOAK_BASE_URL: http://keycloak.identity.svc.cluster.local:8080
  KEYCLOAK_REALM: fintechbankx
  IDENTITY_ADMIN_CLIENT_ID: svc-cus-profile-kyc

# Database credential, synced from AWS Secrets Manager by External Secrets Operator.
externalSecret:
  enabled: true
  # The platform ClusterSecretStore (External Secrets Operator in namespace
  # external-secrets reads only <env>/* secrets).
  storeName: aws-secrets-manager
  # Secrets Manager secret from deploy/terraform output app_db_secret_name.
  remoteSecretName: ""
  # Secrets Manager secret <env>/customer-profile-kyc-service/oidc-client (platform
  # contract); its client_secret becomes IDENTITY_ADMIN_CLIENT_SECRET. Empty: not synced.
  oidcClientSecretName: ""
  refreshInterval: 1h

topologySpread:
  maxSkew: 1

# Settings the pod cannot start without; rendering fails while any is empty.
requiredConfig: [DB_URL, OIDC_ISSUER_URI, OIDC_JWK_SET_URI, OIDC_AUDIENCE, KAFKA_BOOTSTRAP_SERVERS]

# Mesh-wide STRICT mTLS, default deny, the ALLOW rules per caller principal
# and the ingress NetworkPolicy (mesh #11) are owned by
# fintechbankx-platform-mesh-security-service-mesh; this chart ships no
# PeerAuthentication, AuthorizationPolicy or NetworkPolicy.

# Kafka client certificate for the kafka-strimzi profile (local, kind): the
# Secret holding the PEM files; rendered as KAFKA_TLS_CERT, KAFKA_TLS_KEY and
# KAFKA_TLS_CA only when config.SPRING_PROFILES_ACTIVE includes kafka-strimzi,
# and required then.
kafkaTls:
  secretName: ""
  certKey: user.crt
  keyKey: user.key
  caKey: ca.crt
