// =================================================================
// CUSTOMER INFRASTRUCTURE MODULE
// =================================================================
// Adapters: persistence over the service's own schema (sc_cus_profile_kyc),
// transactional outbox to Kafka, HTTP API and security.
// =================================================================

apply plugin: 'jacoco'

description = 'Customer Infrastructure - Persistence and external service implementations'

dependencies {
    // Application Layer
    api project(':customer-application')
    
    // Shared kernel (vendored)
    implementation project(':shared:kernel')
    
    // Persistence: own schema sc_cus_profile_kyc, Flyway migrations in src/main/resources/db/migration
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    
    // Inbound HTTP and security
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    
    // Messaging (outbox relay) and metrics
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.micrometer:micrometer-core'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

jacoco {
    toolVersion = "0.8.14"
}

// The whole module is gated except SecurityConfiguration's filter-chain and
// JwtDecoder beans and the outbox Kafka wiring, which need a running context and
// are exercised by customer-bootstrap's integration tests. JpaPersistenceTest
// runs the JPA adapters against PostgreSQL (TEST_DB_URL or Docker; CI sets
// REQUIRE_TEST_DB so it cannot skip).
def customerInfrastructureCoverageExcludes = [
    'com/bank/customer/infrastructure/config/OutboxConfiguration*'
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect { dir ->
            fileTree(dir: dir, exclude: customerInfrastructureCoverageExcludes)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect { dir ->
            fileTree(dir: dir, exclude: customerInfrastructureCoverageExcludes)
        }))
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
