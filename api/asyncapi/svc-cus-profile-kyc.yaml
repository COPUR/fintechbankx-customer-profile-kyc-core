# AsyncAPI contract for svc-cus-profile-kyc.
# Status: Proposed. The provider repository owns this contract; this catalog mirrors it.
# Naming: docs/NAMING_CONVENTION_DDD_EDA_BUSINESS_CONTEXT.md
# Validate: npx -y @asyncapi/cli@2.13.0 validate asyncapi/svc-cus-profile-kyc.yaml
asyncapi: 3.0.0
id: urn:fintechbankx:asyncapi:svc-cus-profile-kyc
info:
  title: svc-cus-profile-kyc events
  version: 1.0.0
  description: |-
    Event contract for svc-cus-profile-kyc (repository fintechbankx-customer-profile-kyc-core, canonical name fintechbankx-customer-profile-kyc-service).

    Customer.Customer.CreditScoreUpdated.v1 carries customerId and updatedAt only; consumers read the score through GET /api/v1/customers/{id}/credit under the azp allow-list, and credit limit events keep their amounts. This contract is unreleased (absent on main, topics not created, catalog #11 unmerged), so removing the score value is an edit to an unreleased contract and keeps version 1.0.0.

    Status: Proposed. Owner: Customer and KYC Squad, Lending and Money Movement Tribe. Event namespace: `evt.cus.customer`.

    Implementation status: events are raised on the Customer aggregate and written by CustomerManagementService through the CustomerEventPublisher port (OutboxCustomerEventPublisher) to the transactional outbox sc_cus_profile_kyc.outbox_event, in the same transaction as the customer. OutboxRelay sends them to Kafka in insertion order, keyed by customer id (one relay at a time, PostgreSQL advisory lock); failures follow ADR-021 decision 4: a payload error (RecordTooLarge, Serialization, InvalidTopic) parks the row, which is replayed by hand (runbook "Parked outbox events"), and the relay continues; every other failure, including authorization, SASL/IAM and unclassified errors, stops the batch without marking the row, is retried with backoff and alerts, and never parks or skips the row, so each customer's events arrive complete and in order. Delivery is at least once: consumers de-duplicate on eventId. Topics are created by the platform catalog, never by the service.

    Every message uses the standard envelope (common/event-envelope.yaml). Record key is the aggregateId. Topics use cleanup.policy=delete. Adding an optional field is a minor change; any removal, rename or type change is a new major version on a new topic with dual-publish.
  tags:
  - name: customer
  - name: evt.cus.customer
  x-service-id: svc-cus-profile-kyc
  x-event-namespace: evt.cus.customer
  x-owning-squad: Customer and KYC Squad
defaultContentType: application/json
servers:
  msk:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Amazon MSK cluster of the FinTechBankX event platform (svc-evt-streaming) on AWS. TLS in transit,
      SASL_SSL with mechanism AWS_MSK_IAM using the service's IRSA role (ADR-024, platform contract 2026-10-08).
    variables:
      bootstrapServers:
        description: MSK IAM bootstrap brokers (port 9098), injected per environment by the platform.
    security:
    - $ref: '#/components/securitySchemes/mskIam'
  local:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Strimzi cluster in namespace kafka, for local and non-AWS environments only. Mutual TLS with
      Strimzi-issued client certificates.
    variables:
      bootstrapServers:
        description: Strimzi TLS bootstrap service, injected per environment.
    security:
    - $ref: '#/components/securitySchemes/mtls'
channels:
  created:
    address: evt.cus.customer.created.v1
    title: evt.cus.customer.created.v1
    description: Customer.Customer.Created.v1. A customer profile was created.
    messages:
      CustomerCreated:
        $ref: '#/components/messages/CustomerCreated'
    bindings:
      kafka:
        topic: evt.cus.customer.created.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
  contactUpdated:
    address: evt.cus.customer.contact-updated.v1
    title: evt.cus.customer.contact-updated.v1
    description: Customer.Customer.ContactUpdated.v1. The customer's contact details changed.
    messages:
      CustomerContactUpdated:
        $ref: '#/components/messages/CustomerContactUpdated'
    bindings:
      kafka:
        topic: evt.cus.customer.contact-updated.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
  creditLimitUpdated:
    address: evt.cus.customer.credit-limit-updated.v1
    title: evt.cus.customer.credit-limit-updated.v1
    description: Customer.Customer.CreditLimitUpdated.v1. The customer's credit limit changed.
    messages:
      CustomerCreditLimitUpdated:
        $ref: '#/components/messages/CustomerCreditLimitUpdated'
    bindings:
      kafka:
        topic: evt.cus.customer.credit-limit-updated.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
  creditReserved:
    address: evt.cus.customer.credit-reserved.v1
    title: evt.cus.customer.credit-reserved.v1
    description: Customer.Customer.CreditReserved.v1. Credit was reserved against the customer's limit.
    messages:
      CustomerCreditReserved:
        $ref: '#/components/messages/CustomerCreditReserved'
    bindings:
      kafka:
        topic: evt.cus.customer.credit-reserved.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
  creditReleased:
    address: evt.cus.customer.credit-released.v1
    title: evt.cus.customer.credit-released.v1
    description: Customer.Customer.CreditReleased.v1. Previously reserved credit was released.
    messages:
      CustomerCreditReleased:
        $ref: '#/components/messages/CustomerCreditReleased'
    bindings:
      kafka:
        topic: evt.cus.customer.credit-released.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
  creditScoreUpdated:
    address: evt.cus.customer.credit-score-updated.v1
    title: evt.cus.customer.credit-score-updated.v1
    description: Customer.Customer.CreditScoreUpdated.v1. The customer's credit score changed.
    messages:
      CustomerCreditScoreUpdated:
        $ref: '#/components/messages/CustomerCreditScoreUpdated'
    bindings:
      kafka:
        topic: evt.cus.customer.credit-score-updated.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
