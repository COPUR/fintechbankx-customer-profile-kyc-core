  kycStatusChanged:
    address: evt.cus.customer.kyc-status-changed.v1
    title: evt.cus.customer.kyc-status-changed.v1
    description: Customer.Customer.KycStatusChanged.v1. Staff verified or rejected the customer's KYC.
    messages:
      CustomerKycStatusChanged:
        $ref: '#/components/messages/CustomerKycStatusChanged'
    bindings:
      kafka:
        topic: evt.cus.customer.kyc-status-changed.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
